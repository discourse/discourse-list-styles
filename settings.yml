allow_style_switching:
  type: bool
  default: true

default_style:
  type: enum
  default: list-plain
  choices:
    - list-plain
    - list-thumbnails
    - grid-cards

list_styles:
  type: objects
  default:
    - label: List
      style: list-plain
      icon: far-rectangle-list
    - label: Thumbnails
      style: list-thumbnails
      icon: far-newspaper
    - label: Cards
      style: grid-cards
      icon: far-images
  schema:
    name: rule
    identifier: label
    properties:
      label:
        type: string
        required: true
        validations:
          max_length: 100
      icon:
        type: string
      style:
        type: enum
        required: true
        default: list-plain
        choices:
          - list-plain
          - list-thumbnails
          - grid-cards
      categories:
        type: categories
      include_subcategories:
        type: boolean
        default: true
      tags:
        type: tags
      show_excerpt:
        type: boolean
        default: true
